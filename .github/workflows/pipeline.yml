name: Tourism Project Pipeline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: pip install -r tourism_project/requirements.txt   # Replace with the path to your project's requirements file.
      - name: Register Dataset
        run: python tourism_project/model_building/data_register.py   # Replace with the path to your dataset registration script.
      - name: Upload Registered Dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data/tourism.csv   # Replace with the path to the raw dataset inside your data folder.

  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: pip install -r tourism_project/requirements.txt   # Replace with the path to your project's requirements file.
      - name: Run Data Preparation
        run: python tourism_project/model_building/prep.py   # Replace with the path to your data preparation script.
      - name: Upload Train Test Splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            Xtrain.csv
            Xtest.csv
            ytrain.csv
            ytest.csv

  model-traning:
    needs: data-prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: pip install -r tourism_project/requirements.txt   # Replace with the path to your project's requirements file.
      - name: Download Train Test Splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits
      - name: Start MLflow Server
        run: |
          nohup mlflow ui --host 0.0.0.0 --port 5000 &
          sleep 5
     - name: Model Building
  run: |
    python tourism_project/model_building/train.py

- name: Commit Trained Model
  run: |
    git config user.name "github-actions[bot]"
    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    git add tourism_project/deployment/best_tourism_package_model_v1.joblib

    if git diff --cached --quiet; then
      echo "No model changes to commit"
    else
      git commit -m "Update trained tourism model"
      git pull --rebase origin main
      git push origin main
    fi
